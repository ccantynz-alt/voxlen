name: iOS

# Builds and tests the iOS app, keyboard and VoxlenKit on GitHub's hosted
# macOS runners. Gluecron runs this repo's merge gate, but has no macOS
# runner yet (Gluecron.com #16478), and these jobs need Xcode.

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'shared/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voxlenkit:
    name: VoxlenKit tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Includes the tests that pin the edit rules and prompt to shared/grammar-fix/.
      - name: swift test
        run: swift test --package-path ios/VoxlenKit

  app:
    name: App and keyboard build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Unsigned simulator build of the app with its embedded keyboard extension.
      - name: Build
        working-directory: ios
        # The full log is long; on failure print every compiler error, not just the tail.
        run: |
          if ! xcodebuild build \
            -project Voxlen.xcodeproj \
            -scheme Voxlen \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E "error:|BUILD FAILED" build.log | sort -u | head -100
            tail -n 40 build.log
            exit 1
          fi
          grep -E "warning:" build.log | sort -u | head -50 || true
          tail -n 5 build.log
