# XcodeGen spec for the Voxlen iOS app and keyboard. Generate the project with:
#   cd ios && xcodegen generate
# Voxlen.xcodeproj is generated, not committed. Set VOXLEN_DEVELOPMENT_TEAM to
# your Apple team ID before generating to sign; CI builds unsigned.
name: Voxlen
options:
  bundleIdPrefix: com.voxlen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${VOXLEN_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

packages:
  VoxlenKit:
    path: VoxlenKit

targets:
  Voxlen:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - target: VoxlenKeyboard
      - package: VoxlenKit
        product: VoxlenCore
      - package: VoxlenKit
        product: VoxlenSecrets
    entitlements:
      path: App/Voxlen.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voxlen.app
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Voxlen
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity

  VoxlenKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: VoxlenKit
        product: VoxlenCore
      - package: VoxlenKit
        product: VoxlenSecrets
    entitlements:
      path: Keyboard/VoxlenKeyboard.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voxlen.app.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Voxlen
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Voxlen:
    build:
      targets:
        Voxlen: all
        VoxlenKeyboard: all
